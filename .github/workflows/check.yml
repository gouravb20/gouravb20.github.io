name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (Astro pages, client script and every notes data file)
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Data, labs, counts and links
        run: node scripts/check-site.mjs
      - name: Upload a preview of the built site (without the book PDFs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: |
            dist
            !dist/**/*.pdf
          retention-days: 7
