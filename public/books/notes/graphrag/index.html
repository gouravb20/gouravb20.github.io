<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>Essential GraphRAG Interactive Notes</title>
  <link rel="stylesheet" href="../../../shared/styles.css">
  <script src="../../../shared/looks.js"></script>
  <script src="../../../shared/sitenav.js" defer></script>
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml"></head>
<body>

  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Open chapters menu" title="Chapters"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></svg></button>
    <a class="iconbtn home-btn" href="../../../index.html" title="Home" aria-label="Home"><span class="site-mark" aria-hidden="true">L</span><span> Home</span></a>

    <div class="brand">
      <div class="logo">G</div>
      GraphRAG Notes
      <span class="brand-sub">Interactive interview prep</span>
    </div>

    <div class="topbar-spacer"></div>

    <div class="progress-pill" title="Overall progress across all chapters">
      <span id="overallProgressText">0%</span>
      <div class="progress-pill-bar"><div class="progress-pill-fill" id="overallProgressFill" style="width:0%"></div></div>
    </div>

    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="Search concepts, labs, questions... (press /)" />
      <div class="search-results" id="searchResults"></div>
    </div>

    <button class="iconbtn" id="themeToggle" title="Toggle theme">Light</button>
    <button class="iconbtn" id="resetBtn" title="Reset all progress">Reset</button>

    <div class="more-wrap">
      <button class="more-toggle" id="moreToggle" aria-label="More actions" title="More">&#8943;</button>
      <div class="more-menu" id="moreMenu">
        <button class="iconbtn" data-action="theme">&#9728; Toggle theme</button>
        <button class="iconbtn" data-action="reset">&#10227; Reset progress</button>
      </div>
    </div>
  </header>

  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="data-part2.js"></script>
  <script src="../../../shared/labkit.js"></script>
  <script src="demos.js"></script>
  <script src="demos-part2.js"></script>
  <script src="../../../shared/deep.js"></script>
  <script src="../../../shared/app.js"></script>
</body>
</html>
